<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
<title>Catálogo | AppDecore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { font-family: 'Inter', sans-serif; }
  .fredoka { font-family: 'Fredoka', sans-serif; }
  * { -webkit-tap-highlight-color: transparent; }
  @keyframes entrar { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .anim-entrar { animation: entrar .3s ease-out; }
  ::-webkit-scrollbar { height: 6px; width: 6px; }
</style>
</head>
<body style="background:#F4F6FD">
<div id="root"></div>

<script type="text/babel" data-presets="react" data-type="module">
const { useState, useEffect, useMemo } = React;

/* ============================================================
   CONFIGURAÇÃO
============================================================ */
const SUPABASE_URL = "https://drizqsevvmyyrdgczjvf.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRyaXpxc2V2dm15eXJkZ2N6anZmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzNDM0MzAsImV4cCI6MjA5ODkxOTQzMH0.uTzYirVcO-TFJ6BCyDY9A8_Etw4v32iWlOETWht_hxQ";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const AZUL = "#16308A";

/* ============================================================
   DADOS DE DEMONSTRAÇÃO
============================================================ */
function fotoDemo(texto, cor) {
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='400' height='400'><rect width='400' height='400' fill='${cor}'/><text x='50%' y='50%' font-family='sans-serif' font-size='22' font-weight='bold' fill='white' text-anchor='middle' dominant-baseline='middle'>${texto}</text></svg>`;
  return `data:image/svg+xml;utf8,${encodeURIComponent(svg)}`;
}
function gerarKitsDemo() {
  let idc = 0;
  const kit = (nome, tipo_evento, publico, nivel, cor, preco, destaque) => ({
    id: `demo-${idc++}`, nome, tipo_evento, publico, nivel, preco, em_destaque: !!destaque,
    itens_inclusos: ["Mesa cilindro", "Painel redondo", "Boleira"],
    fotos: [{ id: "f" + idc, imagem_url: fotoDemo(nome, cor) }],
  });
  return [
    kit("Kit Diamante Unicórnio", "Aniversário Infantil", "Menina", "Diamante", "#EC1E79", 450, true),
    kit("Kit Ouro Futebol", "Aniversário Infantil", "Menino", "Ouro", "#16308A", 320, true),
    kit("Kit Prata Safari", "Mesversário", "Unissex", "Prata", "#8B5CF6", 180, false),
    kit("Kit Luxo 15 Anos", "15 Anos", "Mulher", "Luxo", "#FFC93C", 890, false),
    kit("Kit Minimalista Chá de Bebê", "Chá de Bebê/Fralda", "Unissex", "Minimalista", "#34D399", 150, false),
  ];
}

/* ============================================================
   COMPONENTES
============================================================ */
function ChipsFiltro({ label, opcoes, valor, onChange, corDestaque }) {
  if (!opcoes.length) return null;
  return (
    <div className="mb-2.5">
      <p className="text-[10px] font-bold text-slate-400 uppercase tracking-wide mb-1">{label}</p>
      <div className="flex gap-1.5 overflow-x-auto pb-1">
        <button onClick={() => onChange("")} className="shrink-0 px-3 py-1.5 rounded-full text-xs font-semibold cursor-pointer transition-all" style={{ background: !valor ? corDestaque : "#fff", color: !valor ? "#fff" : "#334155", border: "1px solid " + (!valor ? corDestaque : "#E5E7EB") }}>Todos</button>
        {opcoes.map((o) => (
          <button key={o} onClick={() => onChange(o)} className="shrink-0 px-3 py-1.5 rounded-full text-xs font-semibold cursor-pointer transition-all" style={{ background: valor === o ? corDestaque : "#fff", color: valor === o ? "#fff" : "#334155", border: "1px solid " + (valor === o ? corDestaque : "#E5E7EB") }}>{o}</button>
        ))}
      </div>
    </div>
  );
}

function CardKit({ kit, mostrarValores, corDestaque, favoritado, onFavoritar, onAbrir }) {
  const foto = kit.fotos && kit.fotos[0];
  return (
    <div className="rounded-2xl overflow-hidden bg-white border border-slate-100 shadow-sm anim-entrar">
      <button onClick={() => onAbrir(kit)} className="block w-full text-left cursor-pointer">
        <div className="relative aspect-square bg-slate-100">
          {foto ? <img src={foto.imagem_url} className="w-full h-full object-cover" /> : <div className="w-full h-full flex items-center justify-center text-3xl">🎁</div>}
          {kit.em_destaque && <span className="absolute top-2 left-2 text-[10px] font-bold px-2 py-0.5 rounded-full text-white" style={{ background: "#FFC93C", color: "#5c4200" }}>⭐ Destaque</span>}
        </div>
        <div className="p-3 pb-1">
          <p className="font-bold text-sm truncate" style={{ color: AZUL }}>{kit.nome}</p>
          {(kit.tipo_evento || kit.nivel) && <p className="text-[11px] font-semibold truncate mt-0.5" style={{ color: corDestaque }}>{[kit.tipo_evento, kit.nivel].filter(Boolean).join(" · ")}</p>}
          {mostrarValores && kit.preco && <p className="text-sm font-bold mt-1" style={{ color: AZUL }}>{Number(kit.preco).toLocaleString("pt-BR", { style: "currency", currency: "BRL" })}</p>}
        </div>
      </button>
      <div className="px-3 pb-3 pt-1">
        <button onClick={() => onFavoritar(kit)} className="w-full py-1.5 rounded-lg text-xs font-bold cursor-pointer flex items-center justify-center gap-1" style={{ background: favoritado ? `${corDestaque}22` : "#F1F5F9", color: favoritado ? corDestaque : "#64748b" }}>
          {favoritado ? "❤️ Curtido" : "🤍 Curtir"}
        </button>
      </div>
    </div>
  );
}

function DetalheKit({ kit, mostrarValores, corDestaque, favoritado, onFavoritar, onFechar, whatsappContato, nomeLoja }) {
  const [indiceFoto, setIndiceFoto] = useState(0);
  const [fotoAmpliada, setFotoAmpliada] = useState(false);
  const fotos = kit.fotos || [];
  const linkKit = `${window.location.origin}${window.location.pathname}?d=${new URLSearchParams(window.location.search).get("d") || "demo"}&kit=${kit.id}`;
  const mensagem = mostrarValores
    ? `Oi! Vi o kit "${kit.nome}" no catálogo (${Number(kit.preco || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" })}) e quero saber a disponibilidade.`
    : `Oi! Vi o kit "${kit.nome}" no catálogo e quero saber o valor e a disponibilidade.`;

  return (
    <div className="fixed inset-0 z-50 bg-white overflow-y-auto anim-entrar">
      <div className="sticky top-0 bg-white z-10 flex items-center justify-between px-4 py-3 border-b border-slate-100">
        <button onClick={onFechar} className="w-9 h-9 rounded-full flex items-center justify-center cursor-pointer" style={{ background: "#F1F5F9" }}>
          <svg viewBox="0 0 24 24" fill="none" stroke="#181A33" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-4 h-4"><path d="m15 18-6-6 6-6" /></svg>
        </button>
        <button onClick={() => navigator.clipboard.writeText(linkKit)} className="text-xs font-bold px-3 py-1.5 rounded-full cursor-pointer" style={{ background: "#F1F5F9", color: "#181A33" }}>🔗 Copiar link</button>
      </div>

      <div className="max-w-md mx-auto px-4 pb-8">
        <button onClick={() => setFotoAmpliada(true)} className="relative aspect-square rounded-3xl overflow-hidden bg-slate-100 mt-4 mb-2 w-full cursor-zoom-in">
          {fotos[indiceFoto] ? <img src={fotos[indiceFoto].imagem_url} className="w-full h-full object-cover" /> : <div className="w-full h-full flex items-center justify-center text-4xl">🎁</div>}
        </button>
        {fotos.length > 1 && (
          <div className="flex gap-2 mb-4 overflow-x-auto">
            {fotos.map((f, i) => (
              <button key={f.id} onClick={() => setIndiceFoto(i)} className="shrink-0 w-14 h-14 rounded-xl overflow-hidden cursor-pointer" style={{ border: i === indiceFoto ? `2px solid ${corDestaque}` : "2px solid transparent" }}>
                <img src={f.imagem_url} className="w-full h-full object-cover" />
              </button>
            ))}
          </div>
        )}

        <h1 className="fredoka text-xl font-bold mb-1" style={{ color: AZUL }}>{kit.nome}</h1>
        {(kit.tipo_evento || kit.publico || kit.nivel) && (
          <p className="text-sm font-semibold mb-2" style={{ color: corDestaque }}>{[kit.tipo_evento, kit.publico, kit.nivel].filter(Boolean).join(" · ")}</p>
        )}
        {mostrarValores && kit.preco && <p className="text-2xl font-bold mb-4" style={{ color: AZUL }}>{Number(kit.preco).toLocaleString("pt-BR", { style: "currency", currency: "BRL" })}</p>}

        {kit.itens_inclusos && kit.itens_inclusos.length > 0 && (
          <div className="mb-6">
            <p className="text-xs font-bold text-slate-400 uppercase tracking-wide mb-2">O que vem no kit</p>
            <ul className="space-y-1.5">
              {kit.itens_inclusos.map((item, i) => (
                <li key={i} className="text-sm flex items-center gap-2" style={{ color: AZUL }}>
                  <span style={{ color: corDestaque }}>✓</span> {item}
                </li>
              ))}
            </ul>
          </div>
        )}

        <div className="flex gap-2">
          <button onClick={() => onFavoritar(kit)} className="px-4 py-3 rounded-2xl font-bold text-sm cursor-pointer" style={{ background: favoritado ? `${corDestaque}22` : "#F1F5F9", color: favoritado ? corDestaque : "#64748b" }}>
            {favoritado ? "❤️" : "🤍"}
          </button>
          <a href={`https://wa.me/${whatsappContato}?text=${encodeURIComponent(mensagem)}`} className="flex-1 text-center py-3 rounded-2xl font-bold text-sm text-white cursor-pointer" style={{ background: "#25D366" }}>
            Quero esse kit no WhatsApp
          </a>
        </div>
      </div>

      {fotoAmpliada && fotos[indiceFoto] && (
        <div className="fixed inset-0 z-[60] flex items-center justify-center p-4" style={{ background: "rgba(0,0,0,.92)" }} onClick={() => setFotoAmpliada(false)}>
          <img src={fotos[indiceFoto].imagem_url} className="max-w-full max-h-full rounded-2xl object-contain" />
          <button onClick={() => setFotoAmpliada(false)} className="absolute top-4 right-4 w-10 h-10 rounded-full flex items-center justify-center text-white text-xl cursor-pointer" style={{ background: "rgba(255,255,255,.15)" }}>✕</button>
        </div>
      )}
    </div>
  );
}

function BarraFavoritos({ favoritos, corDestaque, whatsappContato, nomeLoja }) {
  const [aberto, setAberto] = useState(false);
  if (favoritos.length === 0) return null;
  const mensagem = `Oi! Gostei destes kits no catálogo:\n\n${favoritos.map((k) => `• ${k.nome}`).join("\n")}\n\nQuero saber a disponibilidade!`;
  return (
    <>
      <button onClick={() => setAberto(true)} className="fixed bottom-4 right-4 z-30 px-4 py-3 rounded-full font-bold text-sm text-white shadow-lg cursor-pointer flex items-center gap-2" style={{ background: corDestaque }}>
        ❤️ {favoritos.length} curtido{favoritos.length > 1 ? "s" : ""}
      </button>
      {aberto && (
        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/50 p-0 sm:p-4" onClick={() => setAberto(false)}>
          <div className="bg-white rounded-t-3xl sm:rounded-3xl w-full sm:max-w-sm p-6" onClick={(e) => e.stopPropagation()}>
            <h3 className="fredoka text-lg font-bold mb-3" style={{ color: AZUL }}>Seus kits curtidos</h3>
            <ul className="space-y-2 mb-5 max-h-60 overflow-y-auto">
              {favoritos.map((k) => <li key={k.id} className="text-sm" style={{ color: AZUL }}>• {k.nome}</li>)}
            </ul>
            <a href={`https://wa.me/${whatsappContato}?text=${encodeURIComponent(mensagem)}`} className="block text-center py-3 rounded-2xl font-bold text-sm text-white cursor-pointer" style={{ background: "#25D366" }}>
              Mandar tudo pro WhatsApp
            </a>
            <button onClick={() => setAberto(false)} className="w-full text-center py-2.5 mt-2 text-sm font-semibold cursor-pointer" style={{ color: "#94a3b8" }}>Fechar</button>
          </div>
        </div>
      )}
    </>
  );
}

/* ============================================================
   APP PRINCIPAL
============================================================ */
function App() {
  const params = new URLSearchParams(window.location.search);
  const decoradoraId = params.get("d");
  const kitIdDireto = params.get("kit");

  const [carregando, setCarregando] = useState(true);
  const [erro, setErro] = useState("");
  const [decoradora, setDecoradora] = useState(null);
  const [kits, setKits] = useState([]);
  const [busca, setBusca] = useState("");
  const [filtroEvento, setFiltroEvento] = useState("");
  const [filtroPublico, setFiltroPublico] = useState("");
  const [filtroNivel, setFiltroNivel] = useState("");
  const [kitAberto, setKitAberto] = useState(null);
  const [favoritos, setFavoritos] = useState([]);

  useEffect(() => {
    async function carregar() {
      if (!decoradoraId) {
        setDecoradora({ nome_loja: "Studio Encanto (demonstração)", logo_data_url: null, whatsapp_contato: "5511999999999", catalogo_cor_destaque: "#EC1E79", catalogo_texto_boasvindas: "Bem-vinda ao nosso catálogo! Escolha seu kit dos sonhos 💕", catalogo_mostrar_valores: true });
        setKits(gerarKitsDemo());
        setCarregando(false);
        return;
      }
      const { data: dec, error: erroDec } = await sb.from("catalogo_publico").select("*").eq("decoradora_id", decoradoraId).maybeSingle();
      if (erroDec || !dec) { setErro("Não achamos esse catálogo. Confira o link com quem te enviou."); setCarregando(false); return; }
      const { data: listaKits } = await sb.from("catalogo_kits").select("*").eq("decoradora_id", decoradoraId).eq("status", "publicado").order("em_destaque", { ascending: false });
      const { data: listaFotos } = await sb.from("catalogo_kit_fotos").select("*").order("ordem", { ascending: true });
      const fotosPorKit = {};
      (listaFotos || []).forEach((f) => { (fotosPorKit[f.kit_id] = fotosPorKit[f.kit_id] || []).push(f); });
      const kitsCompletos = (listaKits || []).map((k) => ({ ...k, fotos: fotosPorKit[k.id] || [] }));
      setDecoradora(dec);
      setKits(kitsCompletos);
      setCarregando(false);
      if (kitIdDireto) {
        const alvo = kitsCompletos.find((k) => k.id === kitIdDireto);
        if (alvo) setKitAberto(alvo);
      }
    }
    carregar();
  }, [decoradoraId]);

  const corDestaque = decoradora?.catalogo_cor_destaque || "#EC1E79";
  const mostrarValores = decoradora?.catalogo_mostrar_valores !== false;
  const whatsappContato = (decoradora?.whatsapp_contato || "").replace(/\D/g, "");

  const eventosDisponiveis = useMemo(() => [...new Set(kits.map((k) => k.tipo_evento).filter(Boolean))], [kits]);
  const publicosDisponiveis = useMemo(() => [...new Set(kits.map((k) => k.publico).filter(Boolean))], [kits]);
  const niveisDisponiveis = useMemo(() => [...new Set(kits.map((k) => k.nivel).filter(Boolean))], [kits]);

  const filtrados = kits.filter((k) =>
    k.nome.toLowerCase().includes(busca.toLowerCase()) &&
    (!filtroEvento || k.tipo_evento === filtroEvento) &&
    (!filtroPublico || k.publico === filtroPublico) &&
    (!filtroNivel || k.nivel === filtroNivel)
  );
  const destaques = filtrados.filter((k) => k.em_destaque);
  const restante = filtrados.filter((k) => !k.em_destaque);

  function toggleFavorito(kit) {
    setFavoritos((f) => f.some((x) => x.id === kit.id) ? f.filter((x) => x.id !== kit.id) : [...f, kit]);
  }

  if (carregando) return <div className="min-h-screen flex items-center justify-center text-sm text-slate-400">Carregando...</div>;
  if (erro) return <div className="min-h-screen flex items-center justify-center p-6 text-center"><div><p className="text-3xl mb-3">😕</p><p className="font-semibold" style={{ color: AZUL }}>{erro}</p></div></div>;

  return (
    <div className="min-h-screen pb-10">
      {decoradora.catalogo_banner_url && (
        <div className="w-full h-32 sm:h-44 bg-slate-100"><img src={decoradora.catalogo_banner_url} className="w-full h-full object-cover" /></div>
      )}

      <div className="max-w-2xl mx-auto px-4">
        <div className="flex items-center gap-3 pt-5 pb-3">
          {decoradora.logo_data_url ? <img src={decoradora.logo_data_url} className="w-12 h-12 rounded-2xl object-cover" /> : <div className="w-12 h-12 rounded-2xl flex items-center justify-center text-white text-lg font-bold" style={{ background: corDestaque }}>{(decoradora.nome_loja || "?")[0]}</div>}
          <div>
            <h1 className="fredoka text-lg font-bold" style={{ color: AZUL }}>{decoradora.nome_loja}</h1>
            {decoradora.catalogo_instagram && <a href={`https://instagram.com/${decoradora.catalogo_instagram.replace("@", "")}`} className="text-xs font-semibold" style={{ color: corDestaque }}>@{decoradora.catalogo_instagram.replace("@", "")}</a>}
          </div>
        </div>

        {decoradora.catalogo_texto_boasvindas && <p className="text-sm text-slate-500 mb-5">{decoradora.catalogo_texto_boasvindas}</p>}

        <input value={busca} onChange={(e) => setBusca(e.target.value)} placeholder="Buscar kit..." className="w-full px-4 py-3 rounded-2xl border-2 border-slate-200 text-sm mb-4" />

        <ChipsFiltro label="Tipo de evento" opcoes={eventosDisponiveis} valor={filtroEvento} onChange={setFiltroEvento} corDestaque={corDestaque} />
        <ChipsFiltro label="Público" opcoes={publicosDisponiveis} valor={filtroPublico} onChange={setFiltroPublico} corDestaque={corDestaque} />
        <ChipsFiltro label="Nível" opcoes={niveisDisponiveis} valor={filtroNivel} onChange={setFiltroNivel} corDestaque={corDestaque} />

        {filtrados.length === 0 && <p className="text-center text-sm text-slate-400 py-16">Nenhum kit encontrado.</p>}

        {destaques.length > 0 && (
          <div className="mt-4 mb-2">
            <p className="text-xs font-bold uppercase tracking-wide mb-2" style={{ color: corDestaque }}>⭐ Em destaque</p>
            <div className="grid grid-cols-2 gap-3">
              {destaques.map((k) => <CardKit key={k.id} kit={k} mostrarValores={mostrarValores} corDestaque={corDestaque} favoritado={favoritos.some((f) => f.id === k.id)} onFavoritar={toggleFavorito} onAbrir={setKitAberto} />)}
            </div>
          </div>
        )}

        {restante.length > 0 && (
          <div className="mt-5">
            {destaques.length > 0 && <p className="text-xs font-bold uppercase tracking-wide mb-2 text-slate-400">Todos os kits</p>}
            <div className="grid grid-cols-2 gap-3">
              {restante.map((k) => <CardKit key={k.id} kit={k} mostrarValores={mostrarValores} corDestaque={corDestaque} favoritado={favoritos.some((f) => f.id === k.id)} onFavoritar={toggleFavorito} onAbrir={setKitAberto} />)}
            </div>
          </div>
        )}
      </div>

      {kitAberto && (
        <DetalheKit
          kit={kitAberto}
          mostrarValores={mostrarValores}
          corDestaque={corDestaque}
          favoritado={favoritos.some((f) => f.id === kitAberto.id)}
          onFavoritar={toggleFavorito}
          onFechar={() => setKitAberto(null)}
          whatsappContato={whatsappContato}
          nomeLoja={decoradora.nome_loja}
        />
      )}

      <BarraFavoritos favoritos={favoritos} corDestaque={corDestaque} whatsappContato={whatsappContato} nomeLoja={decoradora.nome_loja} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
